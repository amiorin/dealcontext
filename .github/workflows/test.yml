name: CRM integration
on:
  push:
  pull_request:
  # image.yml calls this workflow before it publishes an image.
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dealcontext
          persist-credentials: false
      - name: Read server revision
        id: server
        shell: bash
        run: |
          revision=$(cat dealcontext/POCKETCONTEXT_VERSION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amiorin/pocketcontext
          ref: ${{ steps.server.outputs.revision }}
          path: pocketcontext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocketcontext/go.mod
          cache-dependency-path: pocketcontext/go.sum
      - name: Build server
        working-directory: pocketcontext
        # The flags of pocketcontext's Makefile.
        run: CGO_ENABLED=1 go build -tags sqlite_math_functions -o bin/pocketcontext ./cmd/pocketcontext
      - name: Test CRM
        run: python3 dealcontext/tests/integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test skill
        run: python3 dealcontext/tests/skill.py --binary pocketcontext/bin/pocketcontext
      - name: Test deployment hooks
        run: python3 dealcontext/tests/deploy.py --binary pocketcontext/bin/pocketcontext
